<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Requests Desk">
<title>Requests Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23007aff%22/%3E%3Cpath d=%22M9 16.5l4.5 4.5L23 11%22 fill=%22none%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
/* Layout: iPadOS-style split view — translucent sidebar menu, large-title content column, detail as a sheet. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f7f7fa; --fill:rgba(118,118,128,.12);
  --fg:#1c1c1e; --muted:#6e6e73; --faint:#aeaeb2; --sep:rgba(60,60,67,.16);
  --accent:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30;
  --purple:#af52de; --teal:#30b0c7; --indigo:#5856d6; --pink:#ff2d55; --brown:#a2845e;
  --material:rgba(246,246,250,.78); --shadow:0 10px 40px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:14px; --r-md:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24);
  --fg:#f5f5f7; --muted:#98989d; --faint:#636366; --sep:rgba(84,84,88,.55);
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6; --pink:#ff375f; --brown:#ac8e68;
  --material:rgba(28,28,30,.78); --shadow:0 10px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24);
  --fg:#f5f5f7; --muted:#98989d; --faint:#636366; --sep:rgba(84,84,88,.55);
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6; --pink:#ff375f; --brown:#ac8e68;
  --material:rgba(28,28,30,.78); --shadow:0 10px 40px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;
  background:var(--material);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--sep);padding-block:20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,var(--accent),var(--indigo));display:grid;place-items:center;color:#fff}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav-h{font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 6px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;text-align:left;width:100%}
.nav button:hover{background:var(--fill)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.nav button[aria-current="page"] .cnt{color:rgba(255,255,255,.85)}
.ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:15px;height:15px}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:13px;color:var(--muted)}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

/* Main */
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:2px 0 0;font-weight:700;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.015em;margin:0;font-weight:650}
.sub{color:var(--muted);margin:4px 0 0}
.mchips{display:none}
.m-only{display:none}
.theme-seg{display:inline-flex}
.theme-seg button{display:inline-flex;align-items:center;gap:5px;padding:5px 10px}
.theme-seg svg{width:14px;height:14px}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:7px 10px}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--fg);width:100%}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--fill);color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:none;padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:default}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.tile:hover{box-shadow:0 0 0 1px var(--sep)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile .lab{font-weight:600;font-size:14px}
.tile .meta{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* Grouped list */
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;gap:8px}
.group-h span{font-size:13px;color:var(--muted)}
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:1px solid var(--sep)}
.row:hover{background:var(--surface-2)}
.row .ico{width:28px;height:28px}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{display:flex;align-items:center;gap:8px;flex:none}
.chev{color:var(--faint);width:8px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-age{background:var(--fill);color:var(--muted)}
.p-warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.p-crit{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.p-ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.p-work{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.flagdot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:12px}
.tally div{background:var(--surface-2);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column}
.tally b{font-size:22px}
.tally span{font-size:12px;color:var(--muted)}

.banner{background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px;font-size:14px}
.banner p small{display:block;color:var(--muted);font-size:13px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:50;background:var(--bg);box-shadow:var(--shadow);
  transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.sh-body{overflow:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:18px}
.sh-body>*,.inspector>*{flex-shrink:0}
.storelist{display:flex;flex-direction:column;gap:6px}
.storelist span{display:flex;justify-content:space-between;gap:8px}
.storelist small{color:var(--muted);font-family:var(--mono);font-size:12px}
.sh-title{display:flex;gap:12px;align-items:center}
.sh-title .ico{width:44px;height:44px;border-radius:11px}
.sh-title .ico svg{width:22px;height:22px}
.kv{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.kv-row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;position:relative}
.kv-row+.kv-row::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:1px solid var(--sep)}
.kv-k{color:var(--muted);font-size:13px;padding-top:1px}
.kv-v{white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.kv-v.fix{color:var(--orange)}
.copy{color:var(--accent);font-size:13px;font-weight:600;padding:1px 4px}
.issues{background:color-mix(in srgb,var(--orange) 12%,var(--surface));border-radius:var(--r-lg);padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.issues b{color:var(--orange)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:70px;border-radius:var(--r-md);border:1px solid var(--sep);background:var(--surface);color:var(--fg);font:inherit;padding:10px;resize:vertical}
.hist{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:16px 64px}
  .mchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
  .mchips::-webkit-scrollbar{display:none}
  .mchips button{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;white-space:nowrap;font-weight:500;font-size:14px}
  .mchips button .ico{width:22px;height:22px;border-radius:999px}
  .mchips button .ico svg{width:12px;height:12px}
  .mchips button[aria-current="page"]{background:var(--accent);color:#fff}
  .m-only{display:flex;justify-content:flex-end}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:30px}
  .sheet{top:auto;left:0;width:100%;height:92%;border-radius:14px 14px 0 0;transform:translateY(105%)}
  .kv-row{grid-template-columns:96px minmax(0,1fr) auto}
}
/* Desktop: table rows + persistent inspector */
.dhead,.drow{display:grid;grid-template-columns:24px 28px minmax(0,1fr) minmax(130px,210px) 64px 150px;gap:12px;align-items:center;padding:9px 14px}
.dhead{font-size:12px;font-weight:600;color:var(--muted);padding-block:8px;box-shadow:inset 0 -1px 0 var(--sep)}
.drow{cursor:pointer}
.drow.compact{grid-template-columns:28px minmax(0,1fr) 52px auto}
.drow.compact>span:first-child,.drow.compact .cell-store{display:none}
.drow+.drow{box-shadow:inset 0 1px 0 var(--sep)}
.drow:hover{background:var(--surface-2)}
.drow.sel{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.drow .ico{width:28px;height:28px}
.drow .row-t .flagdot{display:inline-block;margin-left:6px;vertical-align:2px}
.cell-store{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.cell-store small{display:block;color:var(--muted);font-size:12px}
.cell-date{color:var(--muted);font-size:13px}
.cell-st{display:flex;justify-content:flex-end}
.cbox{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:#fff;padding:0}
.cbox.on{background:var(--accent);border-color:var(--accent)}
.cbox svg{width:12px;height:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,440px);gap:20px;align-items:start}
.pane-list{min-width:0;display:flex;flex-direction:column;gap:16px}
.inspector{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 40px);overflow:auto;border:1px solid var(--sep);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--bg)}
.insp-bar{display:flex;justify-content:space-between;align-items:center}
.bulk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--material);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-radius:12px;padding:8px 12px;box-shadow:0 0 0 1px var(--sep)}
.kbd-hint{font-size:12px;color:var(--muted);line-height:2}
kbd{font-family:var(--font);font-size:11px;border:1px solid var(--sep);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface);color:var(--fg)}
.sum-grid{display:grid;gap:22px}
@media (min-width:1100px){
  main{padding-block:28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1480px}
  .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
  .sum-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(380px,100%);background:var(--surface);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login-card .brand-mark{width:52px;height:52px;border-radius:13px}
.login-card h1{font-size:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--surface-2);color:var(--fg);outline:0}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.field input.code{letter-spacing:.4em;font-variant-numeric:tabular-nums;text-align:center;font-size:24px}
.login-card .btn{justify-content:center;padding:12px;font-size:16px}
.err{color:var(--red);font-size:14px;min-height:1em;margin:0}
.fine{color:var(--muted);font-size:13px;margin:0}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who b{font-weight:600;color:var(--fg)}
.utable{width:100%;border-collapse:collapse}
.utable th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px 12px}
.utable td{padding:10px 12px;border-top:1px solid var(--sep);font-size:14px}
.ufrm{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:8px;padding:12px;align-items:end}
.ufrm input,.ufrm select{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--sep);background:var(--surface-2);color:var(--fg);min-width:0}
@media (max-width:640px){.ufrm{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<div class="login" id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side" aria-label="Request categories">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
      <div><b>Requests Desk</b><small>NY Connection · Employee Requests</small></div></div>
    <div><div class="nav-h">Overview</div><nav class="nav" id="nav-top"></nav></div>
    <div><div class="nav-h">Request queues</div><nav class="nav" id="nav-cats"></nav></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Request details">
  <div class="sh-head"><button class="btn ghost" id="sh-close">Close</button><button class="btn ghost" id="sh-copyall">Copy all</button></div>
  <div class="sh-body" id="sh-body"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Config ============ */
const SHEET_ID = "13oBx6Hq5-JrvR_8Jx0Ss5rbD_rKbiIqmTvutSmsu6ls";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
/* Paste your Apps Script web-app URL here (Deploy → Manage deployments → Web app URL) */
const API_URL = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
const TOKEN_KEY = "rd.session";
const STALE_DAYS = 3, CRIT_DAYS = 7;

const I = {
  grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',

function brinksStores(r){ return (r.v("Stores")||"").split(/,\s*(?=Wireless Zone)/).map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/\(([^)]+)\)\s*$/); return {name:short(s.replace(/\s*\([^)]+\)\s*$/,"")), id:m?m[1]:""}; }); }

function emailIssue(e,out,label,mustWZ){
  const s=String(e||"").trim(); if(!s || /^(no email|personal email)$/i.test(s)){ if(mustWZ) out.push(label+" is missing."); return; }
  if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(s.replace(/\s/g,""))) out.push(`${label} "${s}" is malformed.`);
  else if(/\.con$/i.test(s)) out.push(`${label} ends in ".con" — likely ".com".`);
  else if(/wire[^@]*zone/i.test(s) && !/@wireless-zone\.com$/i.test(s)) out.push(`${label} domain looks misspelled (expected @wireless-zone.com).`);
  else if(mustWZ && !/@wireless-zone\.com$/i.test(s)) out.push(`${label} is a personal address, not @wireless-zone.com.`);
  if(/\s/.test(s)) out.push(`${label} contains a space.`);
}

function parseTs(s){ const m=String(s||"").match(/(\d+)\/(\d+)\/(\d+),?\s*(\d+):(\d+):(\d+)\s*(AM|PM)?/i); if(!m) return null;
  let h=+m[4]; if(m[7]){ if(/pm/i.test(m[7]) && h<12) h+=12; if(/am/i.test(m[7]) && h===12) h=0; }
  return new Date(+m[3], +m[1]-1, +m[2], h, +m[5], +m[6]); }
const pad=n=>String(n).padStart(2,"0");
const colLetter=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};

function buildRows(tabKey, values){
  const t=TAB[tabKey]; const H=(values[0]||[]).map(h=>String(h).trim()); const si=H.indexOf("Status");
  const seen={}; const out=[];
  for(let i=1;i<values.length;i++){
    const raw=values[i]||[]; if(!raw[0]) continue;
    const ts=parseTs(raw[0]); if(!ts) continue;
    let key=`${tabKey}-${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}-${pad(ts.getHours())}${pad(ts.getMinutes())}${pad(ts.getSeconds())}`;
    if(seen[key]) key+="-"+(++seen[key]); else seen[key]=1;
    const col=h=>{const j=H.indexOf(h); return j<0?"":String(raw[j]??"").trim();};
    const r={ key, tab:tabKey, ts, rawTs:String(raw[0]).trim(), rowNum:i+1, sheetStatus: si>=0?String(raw[si]||"").trim():"",
      hb:col("Handled By"), ua:col("Updated At"), tn:col("Team Notes"),
      v:(h)=>{const j=H.indexOf(h); return j<0?"":String(raw[j]??"").trim();} };
    out.push(r);
  }
  // duplicate detection: same identity within 14 days earlier
  const byId={};
  out.forEach(r=>{ const id=t.ident(r); (byId[id]=byId[id]||[]).push(r); });
  Object.values(byId).forEach(list=>{ list.sort((a,b)=>a.ts-b.ts); for(let k=1;k<list.length;k++){ if(list[k].ts-list[k-1].ts < 14*864e5) list[k].dupOf=list[k-1]; }});
  out.forEach(r=>{ r.issues=t.checks(r); if(r.dupOf) r.issues.unshift(`Possible duplicate of the ${fmtDate(r.dupOf.ts)} request${r.dupOf.sheetStatus?` (already ${r.dupOf.sheetStatus})`:""}.`); });
  return out;
}

const task = r => (r.hb||r.tn) ? { by:r.hb, note:r.tn, at:(parseTs(r.ua)||{getTime:()=>0}).getTime() } : null;
function state(r){
  const s=(r.sheetStatus||"").toLowerCase();
  if(!s) return "open";
  if(/^(done|complete|completed)$/.test(s)) return "done";
  if(s==="in progress") return "working";
  if(s==="needs info") return "issue";
  return "closed";
}
const isOpen = r => ["open","working","issue"].includes(state(r));
const ageDays = r => Math.floor((Date.now()-r.ts)/864e5);

function renderSummary(){
  const rows=allRows(); const open=rows.filter(isOpen);
  const loaded = TABS.some(t=>S.rows[t.key]);
  let h = `${mobileChips()}<div class="top"><div><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div><h1>Summary</h1>
    <p class="sub">${loaded?`${open.length} open request${open.length===1?"":"s"} across ${TABS.length} queues.`:"Loading requests…"}</p></div></div>`;
  h += sourceBanner();
  h += `<div class="tiles">` + TABS.map(t=>{
    const rs=(S.rows[t.key]||[]).filter(isOpen); const n=rs.length;
    const fresh=rs.filter(r=>ageDays(r)<STALE_DAYS).length, mid=rs.filter(r=>ageDays(r)>=STALE_DAYS&&ageDays(r)<CRIT_DAYS).length, old=n-fresh-mid;
    const oldest=rs.reduce((m,r)=>Math.max(m,ageDays(r)),0);
    const pct=x=>n?(x/n*100):0;
    return `<button class="tile" data-view="${t.key}"><div class="tile-top"><span class="ico" style="background:${t.color}">${svg(t.icon)}</span><span class="big num">${S.rows[t.key]?n:"–"}</span></div>
      <div><div class="lab">${t.label}</div><div class="meta num">${n?`Oldest ${oldest} day${oldest===1?"":"s"}`:(S.rows[t.key]?"All clear":"Loading")}</div></div>
      <div class="bar" title="Under ${STALE_DAYS} days · ${STALE_DAYS}–${CRIT_DAYS-1} days · ${CRIT_DAYS}+ days"><i style="width:${pct(fresh)}%;background:var(--green)"></i><i style="width:${pct(mid)}%;background:var(--orange)"></i><i style="width:${pct(old)}%;background:var(--red)"></i></div></button>`;
  }).join("") + `</div>`;

  const att = open.filter(r=>r.issues.length).sort((a,b)=>a.ts-b.ts);
  const urgent = open.filter(r=>/expedit|overnight|asap|as soon|urgent|next day|fastest/i.test((r.v("Comments")||"")+(r.v("Notes")||""))).sort((a,b)=>a.ts-b.ts);
  const working = open.filter(r=>state(r)!=="open").sort((a,b)=>a.ts-b.ts);
  const newest = open.slice().sort((a,b)=>b.ts-a.ts).slice(0,8);
  const grp=(title,note,list,limit)=> list.length?`<section class="group"><div class="group-h"><h2>${title}</h2><span>${note}</span></div><div class="list">${list.slice(0,limit).map(r=>rowHtml(r,true)).join("")}</div></section>`:"";
  h += `<div class="sum-grid">`;
  if(loaded){
    h += grp("Rush requests",`${urgent.length} asking for overnight or ASAP`,urgent,10);
    h += grp("Check before doing",`${att.length} with a duplicate or a data problem`,att,10);
    h += grp("In progress & needs info",`${working.length}`,working,20);
    h += grp("Newest",`last ${newest.length}`,newest,8);
    h += `</div>`;
    if(!open.length) h += emptyState("Everything is done","New requests show up here as soon as they're submitted.");
  } else h += `</div>`;
  return h;
}

function sourceBanner(){
  const loaded = TABS.some(t=>S.rows[t.key]);
  if(S.loadErr && !loaded) return `<div class="banner"><p>Couldn't load requests<small>${esc(S.loadErr)}</small></p><button class="btn" data-act="refresh">Try again</button></div>`;
  if(!loaded) return `<div class="banner"><p>Loading requests<small>Reading the Google Sheet…</small></p></div>`;
  if(S.loadErr) return `<div class="banner"><p>Showing the last loaded data<small>${esc(S.loadErr)}</small></p><button class="btn" data-act="refresh">Retry</button></div>`;
  return "";
}

const STATUS_TXT={open:"",working:"In Progress",issue:"Needs Info",done:"Done"};
async function api(action, payload){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)) return {ok:false,error:"not_configured"};
  try{
    const res=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({action,token:S.token},payload||{}))});
    const j=await res.json();
    if(j && j.error==="signed_out" && S.me){ signOut("Your session ended. Sign in again."); }
    return j;
  }catch(e){ return {ok:false,error:"network"}; }
}
function errText(r){ return ({network:"Can't reach the server. Check your connection.",row_moved:"That row changed in the sheet. Refreshed — try again.",
  admin_only:"Only admins can do that.",cant_remove_self:"You can't remove your own access.",bad_email:"Enter a valid email.",
  not_configured:"The dashboard isn't connected to its backend yet (API_URL).",server_error:"The server hit an error. Try again."})[r&&r.error]||"Couldn't save. Try again."; }

async function setTask(r, status, note){
  if(!S.me){ toast("Sign in first"); return false; }
  const prev={s:r.sheetStatus,hb:r.hb,tn:r.tn,ua:r.ua};
  if(status!==undefined) r.sheetStatus=STATUS_TXT[status];
  if(note!==undefined) r.tn=note;
  r.hb=S.me.name; render();
  const res=await api("update",{tab:r.tab,row:r.rowNum,ts:r.rawTs,status,note,title:TAB[r.tab].title(r)});
  if(!res.ok){ Object.assign(r,{sheetStatus:prev.s,hb:prev.hb,tn:prev.tn,ua:prev.ua}); toast(errText(res)); if(res.error==="row_moved") loadData(); render(); return false; }
  return true;
}

document.addEventListener("click", async (ev)=>{

  if(b.dataset.themeSet){ THEME=b.dataset.themeSet; try{localStorage.setItem("rd.theme",THEME);}catch(e){} applyTheme(); render(); return; }
  if(b.dataset.seg){ S.seg=b.dataset.seg; render(); return; }

  if(b.dataset.copy!==undefined){ const el=$("f"+b.dataset.copy); const lab=b.getAttribute("aria-label").replace("Copy ","").replace(/\s*\(\d+\)$/,""); const hid=el.querySelector("span[hidden]"); copyText(hid?hid.textContent:el.textContent,lab); return; }

    const res=await api("bulk",{status:kind,items:rows.map(x=>({tab:x.tab,row:x.rowNum,ts:x.rawTs,title:TAB[x.tab].title(x)}))});
    const okN = res.ok ? res.results.filter(z=>z.ok).length : 0;
    if(!res.ok || okN<rows.length){ toast(res.ok?`${okN} of ${rows.length} saved — refreshing`:errText(res)); loadData(); }
    else toast(kind==="done"?`${okN} marked done`:`${okN} started`);
    render(); return; }
  if(b.dataset.act==="refresh"){ loadData(true); return; }

    const r=await api("saveUser",{email:u.email,name:u.name,role:u.role,active:b.dataset.uact==="restore"}); if(r.ok){ S.users=r.users; toast(b.dataset.uact==="restore"?"Access restored":"Access removed"); } else toast(errText(r)); render(); return; }
  if(b.dataset.act==="copyall"){ const x=findRow(isDesk()?S.sel:S.open); if(x) copyText(TAB[x.tab].copy(x),"Details"); return; }

    return;
  }

});

function segFor(r){ const st=state(r); return st==="open"?"open":(st==="working"||st==="issue")?"working":"done"; }

document.addEventListener("keydown",e=>{

  if(e.key==="Escape"){ if(typing){ e.target.blur(); return; } if(S.open){ closeSheet(); return; } if(S.checked.size){ S.checked.clear(); render(); } return; }

  if(e.key==="/"){ const q=$("q"); if(q){ e.preventDefault(); q.focus(); } return; }

  if(!isDesk() || !TAB[S.view] || !S.curList.length) return;
  const i=S.curList.indexOf(S.sel);
  if(e.key==="ArrowDown"||e.key==="j"){ e.preventDefault(); selectRow(S.curList[Math.min(S.curList.length-1,i+1)]); return; }
  if(e.key==="ArrowUp"||e.key==="k"){ e.preventDefault(); selectRow(S.curList[Math.max(0,i-1)]); return; }
  const q=sel=>document.querySelector("#inspector "+sel);
  if(e.key==="d"){ q('[data-task="done"]')?.click(); return; }
  if(e.key==="s"){ q('[data-task="working"]')?.click(); return; }
  if(e.key==="c"){ q('[data-act="copyall"]')?.click(); return; }
  if(e.key==="x" && S.sel){ const r=findRow(S.sel); if(r&&canBulk(r)){ S.checked.has(S.sel)?S.checked.delete(S.sel):S.checked.add(S.sel); render(); } return; }
});
DESK.addEventListener && DESK.addEventListener("change",()=>{ if(isDesk()&&S.open){ S.sel=S.open; closeSheet(); } render(); });
document.addEventListener("input",e=>{ if(e.target.id==="note"){ S.noteDraft={key:isDesk()?S.sel:S.open,val:e.target.value}; return; }
  if(e.target.id==="q"){ S.q=e.target.value; S.focusQ=true; render(); S.focusQ=false; } });

/* ============ Boot ============ */
(function initView(){ let h=(location.hash||"").slice(1); if(!h){ try{h=localStorage.getItem("rd.view")||"";}catch(e){} }
  if(h==="summary"||TAB[h]) S.view=h; })();
render();

/* ---------- session (30 days, stored on this device) ---------- */
function loadSession(){ try{ const x=JSON.parse(localStorage.getItem(TOKEN_KEY)||"null"); if(x && x.token && x.expires>Date.now()){ S.token=x.token; S.me=x.me; } }catch(e){} }
function saveSession(x){ try{ localStorage.setItem(TOKEN_KEY,JSON.stringify(x)); }catch(e){} }
function signOut(msg){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} S.token=null; S.me=null; S.rows={}; S.users=null; showLogin(msg); render(); }

function showLogin(msg, email){
  const L=$("login");
  L.innerHTML=`<form class="login-card" id="lf" novalidate>
    <div class="brand-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
    <div><h1>Requests Desk</h1><p class="sub">NY Connection · Employee Requests</p></div>
    ${email?`<p class="fine">We emailed a 6-digit code to <b>${esc(email)}</b>. It expires in 10 minutes.</p>
      <div class="field"><label for="l-code">Code</label><input id="l-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
      <p class="err" id="l-err">${esc(msg||"")}</p>
      <button class="btn primary" type="submit">Sign in</button>
      <button class="btn ghost" type="button" data-act="l-back">Use a different email</button>`
    :`<div class="field"><label for="l-email">Work email</label><input id="l-email" type="email" autocomplete="email" required placeholder="you@nyconnectionli.com"></div>
      <p class="err" id="l-err">${esc(msg||"")}</p>
      <button class="btn primary" type="submit">Email me a code</button>
      <p class="fine">You'll stay signed in on this device for 30 days.</p>`}
  </form>`;
  L.dataset.email=email||"";
  setTimeout(()=>{ const i=$(email?"l-code":"l-email"); i&&i.focus(); },30);
}
document.addEventListener("submit", async e=>{
  if(e.target.id==="lf"){ e.preventDefault(); const L=$("login"); const btn=e.target.querySelector('button[type="submit"]'); const err=$("l-err");
    if(!L.dataset.email){
      const email=$("l-email").value.trim().toLowerCase(); if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)){ err.textContent="Enter a valid email."; return; }
      btn.disabled=true; btn.textContent="Sending…"; const r=await api("requestCode",{email});
      if(!r.ok){ btn.disabled=false; btn.textContent="Email me a code"; err.textContent=r.error==="not_configured"?errText(r):"Couldn't send a code. Try again."; return; }
      showLogin("",email);
    } else {
      const code=$("l-code").value.replace(/\D/g,""); if(code.length!==6){ err.textContent="Enter the 6-digit code."; return; }
      btn.disabled=true; btn.textContent="Checking…"; const r=await api("verifyCode",{email:L.dataset.email,code});
      if(!r.ok){ btn.disabled=false; btn.textContent="Sign in";
        err.textContent=({wrong_code:`That code isn't right. ${r.triesLeft} tries left.`,code_expired:"That code expired. Go back and request a new one.",too_many_tries:"Too many tries. Request a new code.",no_access:"This email doesn't have access. Ask Jonathan to add you."})[r.error]||"Couldn't sign in. Try again."; return; }
      S.token=r.token; S.me=r.me; saveSession({token:r.token,expires:r.expires,me:r.me}); render(); loadData();
    }
  }
  if(e.target.id==="ufrm"){ e.preventDefault(); const email=$("u-email").value.trim(), name=$("u-name").value.trim(), role=$("u-role").value;
    const r=await api("saveUser",{email,name,role,active:true}); if(r.ok){ S.users=r.users; toast(name+" can now sign in"); render(); } else toast(errText(r)); }
});
document.addEventListener("click", e=>{ const b=e.target.closest('[data-act="l-back"]'); if(b) showLogin(); });

/* ---------- data ---------- */
async function loadData(manual){
  if(!S.token || S.loading) return; S.loading=true;
  const r=await api("data"); S.loading=false;
  if(!S.token) return;
  if(!r.ok){ if(r.error!=="signed_out"){ S.loadErr=errText(r); render(); } return; }
  S.loadErr=null; if(r.me){ S.me=r.me; }
  TABS.forEach(t=>{ const v=r.tabs[t.key]; if(v&&v.length){ S.rows[t.key]=buildRows(t.key,v); S.syncedAt[t.key]=r.at; } else S.rows[t.key]=S.rows[t.key]||[]; });
  if(manual) toast("Refreshed");
  render();
}
loadSession();
if(S.me){ render(); loadData(); } else { showLogin(); render(); }
// keep it current: refresh every 60s while the tab is visible (not while typing a note)
setInterval(()=>{ if(document.visibilityState==="visible" && S.me && !(document.activeElement&&document.activeElement.id==="note")) loadData(); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.me) loadData(); });
</script>
</body>
